[project]
name = "campus-rag-mvp"
version = "0.1.0"
description = "RAG assistant over university documents with role-based access, versioned policies and citations"
readme = "README.md"
authors = [
    { name = "Simran Dangol", email = "simrandangol10@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docling>=2.140.0",
    "fastapi>=0.143.3",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
]
